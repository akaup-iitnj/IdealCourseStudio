appId: edu.idealinstitute.coursestudio
productName: Course Studio
copyright: Ideal Institute of Technology
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
extraResources:
  # The cs_py package. The bundled Python runtime (python-build-standalone) joins it in M9.
  - from: python
    to: python
    filter:
      - cs_py/**/*.py
      - pyproject.toml
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  executableName: Course Studio
  # Code signing comes later (Azure Artifact Signing).
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Course-Studio-Setup-${version}.${ext}
  shortcutName: Course Studio
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
linux:
  target: [dir]
  icon: build/icon.png
publish: null
