[project]
name = "cs-py"
version = "0.1.0"
description = "Course Studio helper tools. Each prints JSON Lines progress to stdout."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
cs_py = "cs_py.__main__:main"

[dependency-groups]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cs_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
